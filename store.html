<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .store-hero{
    padding:40px 0 30px;background:var(--deep);color:#fff;
  }
  .store-hero h1{font-family:var(--font-display);font-size:clamp(26px,4vw,38px);margin:0 0 8px;}
  .store-hero p{color:rgba(255,255,255,.75);max-width:60ch;line-height:1.6;margin:0;}
  .store-hero a.wa{
    display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:var(--gold-soft);font-weight:700;font-size:14px;
  }

  .products-wrap{padding:36px 0 60px;}
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;}
  .product-card{padding:0;overflow:hidden;transition:transform .15s ease, box-shadow .15s ease;}
  .product-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px -14px rgba(23,58,69,.3);}
  .product-card img{width:100%;height:190px;object-fit:cover;background:var(--paper-2);}
  .pc-body{padding:16px;}
  .pc-body h3{margin:0 0 4px;font-family:var(--font-display);font-size:16px;color:var(--deep);}
  .pc-body p{margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .pc-foot{display:flex;align-items:center;justify-content:space-between;}
  .price{font-family:var(--font-mono);font-weight:700;color:var(--clay);font-size:15px;}

  .cart-fab{
    position:fixed;bottom:24px;left:24px;background:var(--gold);color:var(--deep-2);
    border-radius:999px;padding:14px 20px;font-weight:800;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:8px;cursor:pointer;z-index:40;border:none;font-size:14px;
  }
  .cart-count{background:var(--deep-2);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px;}

  #cart-overlay{
    position:fixed;inset:0;background:rgba(14,39,47,.5);display:none;z-index:60;
  }
  #cart-overlay.show{display:block;}
  .cart-panel{
    position:absolute;top:0;left:0;height:100%;width:min(400px,90vw);background:#fff;
    padding:26px;overflow-y:auto;box-shadow:var(--shadow);
  }
  .cart-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .cart-item img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .cart-item .ci-info{flex:1;}
  .cart-item h5{margin:0 0 2px;font-size:14px;}
  .qty-controls{display:flex;align-items:center;gap:8px;}
  .qty-controls button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;}

  .cart-total{display:flex;justify-content:space-between;padding:16px 0;font-weight:800;font-size:16px;color:var(--deep);}

  #checkout-form.hidden{display:none;}
  .empty{text-align:center;padding:40px 0;color:var(--ink-soft);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="dot"></span> <span id="nav-store-name">متجر</span></div>
  </div>
</div>

<section class="store-hero">
  <div class="container">
    <h1 id="store-name">...</h1>
    <p id="store-desc"></p>
    <a class="wa" id="wa-link" style="display:none;" target="_blank">💬 تواصل معنا فالواتساب</a>
  </div>
</section>

<section class="products-wrap">
  <div class="container">
    <div class="product-grid" id="product-grid"></div>
  </div>
</section>

<button class="cart-fab" id="cart-fab">🛒 السلة <span class="cart-count" id="cart-count">0</span></button>

<div id="cart-overlay">
  <div class="cart-panel">
    <div class="spread" style="margin-bottom:18px;">
      <h3 style="margin:0;font-family:var(--font-display);color:var(--deep);">السلة ديالك</h3>
      <button class="btn btn-ghost" id="btn-close-cart" style="padding:6px 12px;">✕</button>
    </div>

    <div id="cart-items"></div>
    <div class="cart-total" id="cart-total" style="display:none;">
      <span>المجموع</span><span id="cart-total-amount">0 د.م.</span>
    </div>

    <div id="checkout-form" class="hidden">
      <div class="zellige-rule" style="margin:16px 0;"></div>
      <h4 style="font-family:var(--font-display);color:var(--deep);">معلومات الطلب</h4>
      <div class="field"><label>الاسم الكامل</label><input type="text" id="c-name" placeholder="الاسم ديالك"></div>
      <div class="field"><label>رقم الهاتف</label><input type="text" id="c-phone" placeholder="06XXXXXXXX"></div>
      <div class="field"><label>العنوان الكامل</label><textarea id="c-address" rows="3" placeholder="المدينة، الحي، رقم الدار..."></textarea></div>
      <button class="btn btn-primary btn-block" id="btn-confirm-order">أكد الطلب</button>
    </div>

    <button class="btn btn-gold btn-block" id="btn-go-checkout" style="margin-top:16px;display:none;">إتمام الطلب</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const slug = params.get('store');

let storeData = null;
let products = [];
let cart = JSON.parse(sessionStorage.getItem('cart:'+slug) || '[]');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function saveCart(){
  sessionStorage.setItem('cart:'+slug, JSON.stringify(cart));
  renderCartCount();
}

function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str||''; return d.innerHTML;
}

async function init(){
  if(!slug){
    document.querySelector('.container').innerHTML = '<p class="empty">رابط المتجر ماشي صحيح.</p>';
    return;
  }
  const storeSnap = await getDoc(doc(db,'stores',slug));
  if(!storeSnap.exists()){
    document.querySelector('.products-wrap .container').innerHTML = '<p class="empty">هاد المتجر ماكاينش.</p>';
    return;
  }
  storeData = storeSnap.data();
  document.getElementById('store-name').textContent = storeData.name;
  document.getElementById('nav-store-name').textContent = storeData.name;
  document.title = storeData.name;
  document.getElementById('store-desc').textContent = storeData.description || '';
  if(storeData.whatsapp){
    const wa = document.getElementById('wa-link');
    wa.href = 'https://wa.me/'+storeData.whatsapp;
    wa.style.display = 'inline-flex';
  }

  loadPixel(storeData.pixelId);

  const q = query(collection(db,'stores',slug,'products'), orderBy('createdAt','desc'));
  const snap = await getDocs(q);
  products = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  renderProducts();
  renderCartCount();
}

function loadPixel(pixelId){
  if(!pixelId) return;
  /* eslint-disable */
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', pixelId);
  fbq('track', 'PageView');
  /* eslint-enable */
}

function renderProducts(){
  const grid = document.getElementById('product-grid');
  if(products.length === 0){
    grid.innerHTML = '<p class="empty" style="grid-column:1/-1;">مازال ماكاينش منتجات فهاد المتجر.</p>';
    return;
  }
  grid.innerHTML = '';
  products.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'card product-card';
    el.innerHTML = `
      <img src="${p.imageUrl || 'https://placehold.co/400x300?text=No+Image'}" alt="${escapeHtml(p.title)}">
      <div class="pc-body">
        <h3>${escapeHtml(p.title)}</h3>
        <p>${escapeHtml(p.description||'')}</p>
        <div class="pc-foot">
          <span class="price">${p.price} د.م.</span>
          <button class="btn btn-primary add-btn" data-id="${p.id}" style="padding:8px 14px;font-size:13px;">زيد للسلة</button>
        </div>
      </div>`;
    grid.appendChild(el);
  });
  grid.querySelectorAll('.add-btn').forEach(b=>{
    b.addEventListener('click', ()=>addToCart(b.dataset.id));
  });
}

function addToCart(id){
  const existing = cart.find(c=>c.id===id);
  if(existing){ existing.qty += 1; }
  else{
    const p = products.find(x=>x.id===id);
    cart.push({ id:p.id, title:p.title, price:p.price, imageUrl:p.imageUrl, qty:1 });
  }
  saveCart();
  toast('تزاد للسلة ✓');
}

function renderCartCount(){
  const count = cart.reduce((s,c)=>s+c.qty,0);
  document.getElementById('cart-count').textContent = count;
}

function renderCart(){
  const wrap = document.getElementById('cart-items');
  const totalBox = document.getElementById('cart-total');
  const goBtn = document.getElementById('btn-go-checkout');
  const form = document.getElementById('checkout-form');
  form.classList.add('hidden');

  if(cart.length === 0){
    wrap.innerHTML = '<p class="empty">السلة فارغة.</p>';
    totalBox.style.display = 'none';
    goBtn.style.display = 'none';
    return;
  }
  wrap.innerHTML = '';
  let total = 0;
  cart.forEach(c=>{
    total += c.price * c.qty;
    const el = document.createElement('div');
    el.className = 'cart-item';
    el.innerHTML = `
      <img src="${c.imageUrl || 'https://placehold.co/100'}">
      <div class="ci-info">
        <h5>${escapeHtml(c.title)}</h5>
        <span class="muted" style="font-size:13px;">${c.price} د.م.</span>
        <div class="qty-controls">
          <button class="minus" data-id="${c.id}">−</button>
          <span>${c.qty}</span>
          <button class="plus" data-id="${c.id}">+</button>
        </div>
      </div>`;
    wrap.appendChild(el);
  });
  document.getElementById('cart-total-amount').textContent = total.toFixed(2) + ' د.م.';
  totalBox.style.display = 'flex';
  goBtn.style.display = 'block';

  wrap.querySelectorAll('.plus').forEach(b=>b.addEventListener('click', ()=>{
    cart.find(c=>c.id===b.dataset.id).qty += 1; saveCart(); renderCart();
  }));
  wrap.querySelectorAll('.minus').forEach(b=>b.addEventListener('click', ()=>{
    const item = cart.find(c=>c.id===b.dataset.id);
    item.qty -= 1;
    if(item.qty <= 0) cart = cart.filter(c=>c.id!==b.dataset.id);
    saveCart(); renderCart();
  }));
}

document.getElementById('cart-fab').addEventListener('click', ()=>{
  renderCart();
  document.getElementById('cart-overlay').classList.add('show');
});
document.getElementById('btn-close-cart').addEventListener('click', ()=>{
  document.getElementById('cart-overlay').classList.remove('show');
});
document.getElementById('btn-go-checkout').addEventListener('click', ()=>{
  document.getElementById('checkout-form').classList.remove('hidden');
  document.getElementById('btn-go-checkout').style.display = 'none';
});

document.getElementById('btn-confirm-order').addEventListener('click', async ()=>{
  const name = document.getElementById('c-name').value.trim();
  const phone = document.getElementById('c-phone').value.trim();
  const address = document.getElementById('c-address').value.trim();

  if(!name || !phone || !address){ toast('عمر جميع المعلومات'); return; }
  if(cart.length === 0){ toast('السلة فارغة'); return; }

  const total = cart.reduce((s,c)=>s+c.price*c.qty,0);
  const itemsSummary = cart.map(c=>`${c.title} x${c.qty}`).join(', ');

  const btn = document.getElementById('btn-confirm-order');
  btn.disabled = true; btn.textContent = 'كنبعتو...';

  try{
    if(storeData.sheetUrl){
      await fetch(storeData.sheetUrl, {
        method: 'POST',
        mode: 'no-cors', // Apps Script web apps don't return CORS headers to fetch by default
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          storeName: storeData.name,
          customerName: name,
          phone, address,
          items: itemsSummary,
          total,
          date: new Date().toISOString()
        })
      });
    }

    if(typeof fbq !== 'undefined'){
      fbq('track', 'Purchase', { value: total, currency: 'MAD' });
    }

    toast('توصل طلبك ✓ غادي نتواصلو معاك قريب');
    cart = [];
    saveCart();
    document.getElementById('cart-overlay').classList.remove('show');
  }catch(e){
    toast('وقع مشكل، عاود جرب');
  }finally{
    btn.disabled = false; btn.textContent = 'أكد الطلب';
  }
});

init();
</script>
</body>
</html>
